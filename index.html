
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KONIS Admin Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f2eb;
      color: #243b35;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 35px #00000012;
    }

    h1 { text-align: center; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #777; margin-bottom: 30px; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #173b35;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h1>KONIS</h1>
    <p class="subtitle">
      Kovai Nagarathar Illaignar Sangam<br>
      Admin Portal
    </p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button id="loginButton" type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVAmNCnNU9gS4KumlnUm2p9pfIStfRexI",
      authDomain: "konis-registration.firebaseapp.com",
      projectId: "konis-registration",
      storageBucket: "konis-registration.firebasestorage.app",
      messagingSenderId: "1035543929331",
      appId: "1:1035543929331:web:de6f37e9e0a6e945053286",
      measurementId: "G-20XB5CDPVM"
    };

    const BACKEND_URL =
      "https://konis-backend.ramakrishnansm07.workers.dev";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      message.textContent = "Checking login...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        // Step 1: Verify Firebase email and password.
        const result = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        // Step 2: Get Firebase ID token.
       await result.user.reload();
        const idToken = await result.user.getIdToken(true);

        // Step 3: Verify administrator access through Cloudflare.
        const response = await fetch(
          `${BACKEND_URL}/api/me`,
          {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${idToken}`
            }
          }
        );

        const data = await response.json();

        if (!response.ok) {
          await signOut(auth);

          message.textContent =
            data.error || "Administrator access denied.";

          return;
        }

        message.textContent =
          "Login successful! Welcome to KONIS Admin Portal.";

      } catch (error) {
        console.error(error);

        if (error.code === "auth/invalid-credential") {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "auth/network-request-failed") {
          message.textContent = "Network error. Please try again.";
        } else {
          message.textContent =
            "Login verification failed. Please try again.";
        }

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
